<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Adrien Chinour, Web Architect. Un site minimaliste… qui se casse.">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1A202C" media="(prefers-color-scheme: dark)">
    <title>Adrien Chinour • Web Architect</title>
    <style>
        :root {
            --text: #15141A;
            --bg: #FFFFFF;
            --muted: #6B6B76;
            --accent: #FF5C35;
            --grid: rgba(21, 20, 26, .07);
            --ring: rgba(21, 20, 26, .12);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --text: #F5F5F7;
                --bg: #1A202C;
                --muted: #9AA3B2;
                --accent: #FFB347;
                --grid: rgba(255, 255, 255, .06);
                --ring: rgba(255, 255, 255, .16);
            }
        }

        * { box-sizing: border-box; }

        html, body { height: 100%; }

        body {
            margin: 0;
            color: var(--text);
            background-color: var(--bg);
            background-image:
                linear-gradient(var(--grid) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid) 1px, transparent 1px);
            background-size: 32px 32px;
            font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px 140px;
            overflow-x: hidden;
        }

        body.playing {
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        header { text-align: center; }

        .avatar {
            width: clamp(140px, 30vw, 220px);
            height: auto;
            aspect-ratio: 1;
            border-radius: 50%;
            box-shadow: 0 0 0 6px var(--bg), 0 0 0 8px var(--ring);
            cursor: pointer;
            transition: transform .3s, opacity .4s;
        }

        .avatar:hover { transform: scale(1.03) rotate(-2deg); }

        h1 {
            font-size: clamp(2rem, 9vw, 4.5rem);
            margin: 24px 0 0;
            letter-spacing: .02em;
            line-height: 1.1;
        }

        .role {
            font-size: clamp(1.1rem, 4.5vw, 1.8rem);
            color: var(--muted);
            margin: 8px 0 0;
        }

        nav ul {
            list-style: none;
            display: flex;
            flex-wrap: wrap;
            gap: 12px 16px;
            justify-content: center;
            padding: 0;
            margin: 36px 0 0;
        }

        nav a {
            display: inline-block;
            color: var(--text);
            text-decoration: none;
            font-size: clamp(1.1rem, 4vw, 1.5rem);
            padding: 10px 20px;
            border: 2px solid var(--text);
            border-radius: 6px;
            box-shadow: 4px 4px 0 var(--text);
            transition: transform .15s, box-shadow .15s, opacity .4s;
        }

        nav a:hover, nav a:focus-visible {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 var(--accent);
            outline: none;
        }

        .play {
            margin-top: 40px;
            font: inherit;
            font-size: 1rem;
            color: var(--muted);
            background: none;
            border: 1px dashed var(--muted);
            border-radius: 999px;
            padding: 8px 18px;
            cursor: pointer;
            transition: color .2s, border-color .2s;
        }

        .play:hover, .play:focus-visible { color: var(--accent); border-color: var(--accent); outline: none; }

        /* Chaque lettre / lien / avatar est une brique. */
        .b {
            display: inline-block;
            transition: opacity .3s;
            --fall: 1.1s;
        }

        .b.hit {
            animation: fall var(--fall) cubic-bezier(.45, 0, .85, .6) forwards;
            pointer-events: none;
        }

        @keyframes fall {
            0%   { transform: none; opacity: 1; }
            18%  { transform: translateY(-14px) scale(1.25); opacity: 1; }
            30%  { transform: translateY(0) scale(1.1) rotate(calc(var(--r, 30deg) / 4)); opacity: 1; }
            100% { transform: translateY(45vh) rotate(var(--r, 30deg)); opacity: 0; }
        }

        @media (max-width: 600px) {
            .b { --fall: 1.5s; }
        }

        canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            touch-action: none;
            z-index: 10;
        }

        body.playing canvas { pointer-events: auto; }

        .hud {
            position: fixed;
            left: 16px;
            right: 16px;
            bottom: max(16px, env(safe-area-inset-bottom));
            display: none;
            justify-content: space-between;
            align-items: center;
            font-size: .95rem;
            color: var(--muted);
            z-index: 11;
            pointer-events: none;
        }

        .hud button {
            pointer-events: auto;
            font: inherit;
            color: var(--muted);
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px 8px;
        }

        .hud button:hover { color: var(--accent); }

        body.playing .hud { display: flex; }

        body.playing .play { visibility: hidden; }

        @media (max-width: 600px) {
            .hud #hint { display: none; }
        }

        .overlay {
            position: fixed;
            inset: 0;
            display: none;
            place-items: center;
            background: color-mix(in srgb, var(--bg) 75%, transparent);
            backdrop-filter: blur(3px);
            z-index: 20;
            text-align: center;
            padding: 16px;
        }

        .overlay.show { display: grid; }

        .overlay h2 { font-size: clamp(1.6rem, 6vw, 2.6rem); margin: 0 0 8px; }

        .overlay p { color: var(--muted); margin: 0 0 24px; }

        .overlay button {
            font: inherit;
            font-size: 1.1rem;
            color: var(--bg);
            background: var(--text);
            border: none;
            border-radius: 6px;
            padding: 12px 24px;
            margin: 6px;
            cursor: pointer;
            box-shadow: 4px 4px 0 var(--accent);
        }

        .overlay button.secondary {
            color: var(--text);
            background: none;
            border: 2px solid var(--text);
            box-shadow: none;
        }

        @media (prefers-reduced-motion: reduce) {
            .b, .avatar, nav a { transition: none; }
            .b.hit { animation: none; opacity: 0; }
        }
    </style>
</head>
<body>

<header>
    <img class="avatar b" data-hp="3" id="avatar"
         src="https://avatars.githubusercontent.com/u/24455386?v=4"
         width="220" height="220" alt="Avatar d'Adrien Chinour" title="Clique pour jouer">
    <h1 id="name">Adrien Chinour</h1>
    <p class="role" id="role">Web Architect</p>
</header>

<nav>
    <ul>
        <li><a class="b" target="_blank" rel="noopener" href="https://github.com/adrien-chinour/">GitHub</a></li>
        <li><a class="b" target="_blank" rel="noopener" href="https://www.udfn.fr">Blog</a></li>
    </ul>
</nav>

<button class="play" id="play" type="button">▶ casser cette page</button>

<canvas id="game" aria-hidden="true"></canvas>

<div class="hud" aria-live="polite">
    <span id="score">score 0 · ♥♥♥</span>
    <span id="hint">bouge la raquette · tape pour lancer</span>
    <button id="quit" type="button">✕ quitter</button>
</div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true">
    <div>
        <h2 id="ovTitle"></h2>
        <p id="ovText"></p>
        <button id="again" type="button">rejouer</button>
        <button id="rebuild" type="button" class="secondary">reconstruire</button>
    </div>
</div>

<script>
(() => {
    'use strict';

    const $ = (id) => document.getElementById(id);
    const canvas = $('game');
    const ctx = canvas.getContext('2d');
    const body = document.body;
    const scoreEl = $('score');
    const hintEl = $('hint');
    const overlay = $('overlay');

    // --- Chaque lettre devient une brique ------------------------------------
    const splitLetters = (el) => {
        const text = el.textContent;
        el.textContent = '';
        for (const ch of text) {
            if (ch.trim() === '') { el.append(ch); continue; }
            const s = document.createElement('span');
            s.className = 'b';
            s.textContent = ch;
            s.style.setProperty('--r', (Math.random() * 140 - 70).toFixed(0) + 'deg');
            el.append(s);
        }
    };
    splitLetters($('name'));
    splitLetters($('role'));

    const bricks = [...document.querySelectorAll('.b')].map((el) => ({
        el, maxHp: Number(el.dataset.hp) || 1, hp: 1, alive: true, r: null,
    }));

    // --- État ------------------------------------------------------------------
    const G = {
        state: 'idle', // idle | playing | over
        score: 0, lives: 3, remaining: 0, speed: 6, stuck: true,
        ball: { x: 0, y: 0, vx: 0, vy: 0, r: 7 },
        paddle: { x: 0, y: 0, w: 120, h: 10 },
        keys: { left: false, right: false },
        W: 0, H: 0, dpr: 1, last: 0, raf: 0,
    };

    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

    const resize = () => {
        G.dpr = Math.min(window.devicePixelRatio || 1, 2);
        G.W = window.innerWidth;
        G.H = window.innerHeight;
        canvas.width = G.W * G.dpr;
        canvas.height = G.H * G.dpr;
        ctx.setTransform(G.dpr, 0, 0, G.dpr, 0, 0);
        G.paddle.w = clamp(G.W * 0.22, 80, 150);
        G.paddle.y = G.H - 64;
        G.paddle.x = clamp(G.paddle.x, 0, G.W - G.paddle.w);
        G.speed = clamp(Math.min(G.W, G.H) / 110, 4.5, 8);
        measure();
    };

    const measure = () => {
        for (const b of bricks) {
            if (!b.alive) continue;
            const r = b.el.getBoundingClientRect();
            b.r = { l: r.left, t: r.top, rt: r.right, bt: r.bottom, cx: r.left + r.width / 2, cy: r.top + r.height / 2, hw: r.width / 2, hh: r.height / 2 };
        }
    };

    const hud = () => {
        scoreEl.textContent = `score ${G.score} · ${'♥'.repeat(G.lives)}${'♡'.repeat(3 - G.lives)}`;
    };

    const resetBall = () => {
        G.stuck = true;
        G.ball.x = G.paddle.x + G.paddle.w / 2;
        G.ball.y = G.paddle.y - G.ball.r - 1;
        G.ball.vx = 0;
        G.ball.vy = 0;
        hintEl.textContent = 'tape ou espace pour lancer';
    };

    const launch = () => {
        if (!G.stuck) return;
        G.stuck = false;
        const a = (Math.random() * 0.6 - 0.3);
        G.ball.vx = Math.sin(a) * G.speed;
        G.ball.vy = -Math.cos(a) * G.speed;
        hintEl.textContent = '';
    };

    const rebuild = () => {
        for (const b of bricks) {
            b.alive = true;
            b.hp = b.maxHp;
            b.el.classList.remove('hit');
            b.el.style.opacity = '';
        }
        G.remaining = bricks.length;
    };

    const start = () => {
        rebuild();
        G.state = 'playing';
        G.score = 0;
        G.lives = 3;
        body.classList.add('playing');
        overlay.classList.remove('show');
        resize();
        G.paddle.x = (G.W - G.paddle.w) / 2;
        resetBall();
        hud();
        G.last = performance.now();
        cancelAnimationFrame(G.raf);
        G.raf = requestAnimationFrame(frame);
    };

    const stop = () => {
        G.state = 'idle';
        cancelAnimationFrame(G.raf);
        body.classList.remove('playing');
        overlay.classList.remove('show');
        ctx.clearRect(0, 0, G.W, G.H);
        rebuild();
    };

    const end = (won) => {
        G.state = 'over';
        cancelAnimationFrame(G.raf);
        $('ovTitle').textContent = won ? 'Page démolie 🎉' : 'Perdu';
        $('ovText').textContent = won
            ? `Tout est cassé. Score : ${G.score}.`
            : `Il restait ${G.remaining} brique${G.remaining > 1 ? 's' : ''}. Score : ${G.score}.`;
        overlay.classList.add('show');
    };

    // --- Boucle ----------------------------------------------------------------
    const hit = (b) => {
        b.hp -= 1;
        G.score += 10;
        if (b.hp > 0) {
            b.el.style.opacity = String(0.3 + 0.7 * b.hp / b.maxHp);
        } else {
            b.alive = false;
            b.el.classList.add('hit');
            G.remaining -= 1;
            G.score += b.maxHp > 1 ? 40 : 0;
            G.speed = Math.min(G.speed + 0.05, 12);
            const s = Math.hypot(G.ball.vx, G.ball.vy) || G.speed;
            G.ball.vx *= G.speed / s;
            G.ball.vy *= G.speed / s;
        }
        hud();
    };

    const step = (dt) => {
        const p = G.paddle, ball = G.ball;
        const pv = 9 * dt;
        if (G.keys.left) p.x -= pv;
        if (G.keys.right) p.x += pv;
        p.x = clamp(p.x, 0, G.W - p.w);

        if (G.stuck) {
            ball.x = p.x + p.w / 2;
            ball.y = p.y - ball.r - 1;
            return;
        }

        const vx = ball.vx * dt, vy = ball.vy * dt;
        const n = Math.max(1, Math.ceil(Math.hypot(vx, vy) / 4));
        for (let i = 0; i < n; i++) {
            ball.x += vx / n;
            ball.y += vy / n;

            if (ball.x < ball.r) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
            else if (ball.x > G.W - ball.r) { ball.x = G.W - ball.r; ball.vx = -Math.abs(ball.vx); }
            if (ball.y < ball.r) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); }

            if (ball.y > G.H + ball.r * 3) {
                G.lives -= 1;
                hud();
                if (G.lives <= 0) { end(false); return; }
                resetBall();
                return;
            }

            if (ball.vy > 0 && ball.y + ball.r >= p.y && ball.y - ball.r <= p.y + p.h
                && ball.x >= p.x - ball.r && ball.x <= p.x + p.w + ball.r) {
                const rel = clamp((ball.x - (p.x + p.w / 2)) / (p.w / 2), -1, 1);
                const a = rel * (Math.PI / 3);
                ball.vx = Math.sin(a) * G.speed;
                ball.vy = -Math.cos(a) * G.speed;
                ball.y = p.y - ball.r;
            }

            for (const b of bricks) {
                if (!b.alive) continue;
                const r = b.r;
                const ox = r.hw + ball.r - Math.abs(ball.x - r.cx);
                if (ox <= 0) continue;
                const oy = r.hh + ball.r - Math.abs(ball.y - r.cy);
                if (oy <= 0) continue;
                if (ox < oy) {
                    const s = ball.x < r.cx ? -1 : 1;
                    ball.x += s * ox;
                    ball.vx = s * Math.abs(ball.vx);
                } else {
                    const s = ball.y < r.cy ? -1 : 1;
                    ball.y += s * oy;
                    ball.vy = s * Math.abs(ball.vy);
                }
                hit(b);
                if (G.remaining <= 0) { end(true); return; }
                break;
            }
        }
    };

    const draw = () => {
        ctx.clearRect(0, 0, G.W, G.H);
        const css = getComputedStyle(body);
        const accent = css.getPropertyValue('--accent').trim();
        const text = css.getPropertyValue('--text').trim();
        const p = G.paddle, ball = G.ball;

        ctx.fillStyle = text;
        ctx.beginPath();
        ctx.roundRect(p.x, p.y, p.w, p.h, 5);
        ctx.fill();

        ctx.fillStyle = accent;
        ctx.shadowColor = accent;
        ctx.shadowBlur = 14;
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
    };

    const frame = (t) => {
        if (G.state !== 'playing') return;
        const dt = clamp((t - G.last) / (1000 / 60), 0.2, 2);
        G.last = t;
        step(dt);
        if (G.state === 'playing') {
            draw();
            G.raf = requestAnimationFrame(frame);
        }
    };

    // --- Entrées ---------------------------------------------------------------
    canvas.addEventListener('pointermove', (e) => {
        if (G.state !== 'playing') return;
        G.paddle.x = clamp(e.clientX - G.paddle.w / 2, 0, G.W - G.paddle.w);
    });
    canvas.addEventListener('pointerdown', (e) => {
        if (G.state !== 'playing') return;
        G.paddle.x = clamp(e.clientX - G.paddle.w / 2, 0, G.W - G.paddle.w);
        launch();
    });

    window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') G.keys.left = true;
        if (e.key === 'ArrowRight') G.keys.right = true;
        if (G.state === 'playing') {
            if (e.key === ' ' || e.key === 'ArrowUp') { e.preventDefault(); launch(); }
            if (e.key === 'Escape') stop();
        } else if (G.state === 'over' && e.key === 'Escape') {
            stop();
        }
    });
    window.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowLeft') G.keys.left = false;
        if (e.key === 'ArrowRight') G.keys.right = false;
    });

    window.addEventListener('resize', () => { if (G.state === 'playing') resize(); });

    $('play').addEventListener('click', start);
    $('avatar').addEventListener('click', () => { if (G.state === 'idle') start(); });
    $('quit').addEventListener('click', stop);
    $('again').addEventListener('click', start);
    $('rebuild').addEventListener('click', stop);
})();
</script>
</body>
</html>
